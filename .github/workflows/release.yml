name: 打包并发布

# 触发条件:
# 1. push tag (v1.0.0 这种) → 正式发布
# 2. 手动在 GitHub 网页点 "Run workflow" → 手动出包
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # macOS 用 macos-latest,Windows 用 windows-latest
    # 两个并行跑,约 10-15 分钟
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    runs-on: ${{ matrix.platform }}
    name: 构建 ${{ matrix.label }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        working-directory: .
        run: npm ci || npm install

      - name: 构建 + 打包
        run: npm run tauri:build -- --target ${{ matrix.target }} --verbose

      - name: 打印 bundle 输出 (debug)
        if: always()
        shell: bash
        run: |
          echo "--- bundle 目录树 ---"
          if [ -d src-tauri/target/${{ matrix.target }}/release/bundle ]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle -type f -exec ls -la {} \;
          else
            echo "bundle 目录不存在!Tauri 打包可能失败"
            echo "target 目录:"
            ls -la src-tauri/target/ 2>/dev/null
          fi

      - name: macOS zip 打包 .app (用固定 ASCII 名,避免后面 cleanup 步骤乱码)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [ -d src-tauri/target/${{ matrix.target }}/release/bundle/macos ]; then
            cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
            for app in *.app; do
              [ -d "$app" ] || continue
              echo "原 .app: $app"
              ls -la "$app" | head -3
              # 用 ditto 保留 macOS 扩展属性 (Tauri app 必须),文件名直接用 ASCII
              ditto -c -k --sequesterRsrc --keepParent "$app" "zhisuan-system-mac.zip"
              echo "打包后:"
              ls -la "zhisuan-system-mac.zip"
            done
          fi

      - name: 上传构建产物 (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 智算信息查询系统-macOS-arm64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建产物 (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 智算信息查询系统-Windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # === 仅在打 tag 时:创建 GitHub Release ===
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 macOS 安装包
        uses: actions/download-artifact@v4
        with:
          name: 智算信息查询系统-macOS-arm64
          path: dist/macOS

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: 智算信息查询系统-Windows-x64
          path: dist/Windows

      - name: 清理 + 大小校验 (.zip 已在 macOS 步骤用 ASCII 名,无需重命名)
        shell: bash
        run: |
          set +e
          # 1. 删 macOS AppleDouble 影子
          find dist -type f -name '._*' -delete 2>/dev/null
          find dist -type f -name '.DS_Store' -delete 2>/dev/null

          echo "--- 清理后 dist 内容 ---"
          find dist -type f -exec ls -la {} \;
          echo "---"

          # 2. Windows: 校验 + 重命名
          if [ -d dist/Windows ]; then
            for f in dist/Windows/*.exe; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f")
              size_mb=$((size / 1024 / 1024))
              echo "Windows: $f → ${size_mb}M"
              if [ "$size" -lt 5242880 ]; then
                echo "❌ Windows .exe 太小 (${size_mb}M < 5M),构建异常,中止发布"
                exit 1
              fi
              mv "$f" "dist/Windows/zhisuan-system-setup.exe"
            done
          fi

          # 3. macOS: .dmg 重命名(如果存在);.zip 已经是 ASCII 名
          if [ -d dist/macOS ]; then
            for f in dist/macOS/*.dmg; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f")
              size_mb=$((size / 1024 / 1024))
              echo "macOS .dmg: $f → ${size_mb}M"
              mv "$f" "dist/macOS/zhisuan-system.dmg"
            done
            # 兜底:如果 macOS 步骤的 ditto 没出 .zip,这里再补一次
            if [ ! -f dist/macOS/zhisuan-system-mac.zip ]; then
              for f in dist/macOS/*.app; do
                [ -d "$f" ] || continue
                echo "兜底 zip: $f"
                cd dist/macOS
                ditto -c -k --sequesterRsrc --keepParent "$f" "zhisuan-system-mac.zip"
                cd -
                break
              done
            fi
          fi

          echo "--- 最终文件 ---"
          find dist -type f -exec ls -la {} \;

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/macOS/zhisuan-system.dmg
            dist/macOS/zhisuan-system-mac.zip
            dist/Windows/zhisuan-system-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 智算信息查询系统 v${{ github.ref_name }}

            **安装说明**:
            - 🍎 **macOS (Apple Silicon)**: 下载 `.dmg` 双击挂载拖入 Applications,或下 `.zip` 解压后拖入
            - 🪟 **Windows (x64)**: 下载 `.exe` 双击安装

            **体积**:
            - macOS .app / .dmg: ~19M / ~11M
            - Windows 安装包: ~6M (NSIS + downloadBootstrapper,首装会下 ~100M WebView2)
            - 均 < 50M ✅

            **数据**:
            - 内置"算力数据.xlsx"首次启动自动导入
            - 28 行芯片 + 8 行服务器 + 2 行超节点
