name: 打包并发布

# 触发条件:
# 1. push tag (v1.0.0 这种) → 正式发布
# 2. 手动在 GitHub 网页点 "Run workflow" → 手动出包
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # macOS 用 macos-latest,Windows 用 windows-latest
    # 两个并行跑,约 10-15 分钟
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    runs-on: ${{ matrix.platform }}
    name: 构建 ${{ matrix.label }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        working-directory: .
        run: npm ci || npm install

      - name: 构建 + 打包
        run: npm run tauri:build -- --target ${{ matrix.target }} --verbose

      - name: 打印 bundle 输出 (debug)
        if: always()
        shell: bash
        run: |
          echo "--- bundle 目录树 ---"
          if [ -d src-tauri/target/${{ matrix.target }}/release/bundle ]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle -type f -exec ls -la {} \;
          else
            echo "bundle 目录不存在!Tauri 打包可能失败"
            echo "target 目录:"
            ls -la src-tauri/target/ 2>/dev/null
          fi

      - name: 上传构建产物 (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 智算信息查询系统-macOS-arm64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建产物 (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: 智算信息查询系统-Windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # === 仅在打 tag 时:创建 GitHub Release ===
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 macOS 安装包
        uses: actions/download-artifact@v4
        with:
          name: 智算信息查询系统-macOS-arm64
          path: dist/macOS

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: 智算信息查询系统-Windows-x64
          path: dist/Windows

      - name: 清理 macOS metadata 干扰文件 + 文件大小校验
        shell: bash
        run: |
          # 跨平台构建时 macOS runner 会留下 ._* 隐藏文件 (AppleDouble metadata)
          # 这些会被误识别成 .exe / .dmg,清掉
          find dist -type f -name '._*' -delete 2>/dev/null || true
          find dist -type f -name '.DS_Store' -delete 2>/dev/null || true

          echo "--- 清理后 dist 内容 ---"
          find dist -type f -exec ls -la {} \;
          echo "---"

          # 文件大小校验: Windows NSIS 安装包应该 >= 10M
          if [ -d dist/Windows ]; then
            echo "Windows .exe 文件检查:"
            for f in dist/Windows/*.exe; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              size_mb=$((size / 1024 / 1024))
              echo "  $f → ${size_mb}M"
              if [ "$size" -lt 10485760 ]; then
                echo "❌ Windows .exe 太小 (${size_mb}M < 10M),构建异常,中止发布"
                exit 1
              fi
            done
          fi

          if [ -d dist/macOS ]; then
            echo "macOS .dmg 文件检查:"
            for f in dist/macOS/*.dmg; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              size_mb=$((size / 1024 / 1024))
              echo "  $f → ${size_mb}M"
            done
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macOS/*.dmg
            dist/Windows/*[!.]*.exe
            dist/Windows/[!._]*.exe
            dist/Windows/智算信息查询系统-数据中心事业部*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 智算信息查询系统 v${{ github.ref_name }}

            **安装说明**:
            - 🍎 **macOS (Apple Silicon)**: 下载 `.dmg` 双击挂载,拖入 Applications
            - 🪟 **Windows (x64)**: 下载 `.exe` 双击安装

            **体积**:
            - macOS DMG: ~11M
            - Windows 安装包: ~25M
            - 均 < 50M ✅

            **数据**:
            - 内置"算力数据.xlsx"首次启动自动导入
            - 28 行芯片 + 8 行服务器 + 2 行超节点
