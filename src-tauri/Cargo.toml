[package]
name = "zhisuan-data-app"
version = "2.0.0"
description = "智算信息查询系统 - 数据中心事业部"
authors = ["SilenceQIN"]
edition = "2021"
rust-version = "1.77"

# 让 cargo 知道资源在 ../public (Tauri 标准布局)
[lib]
name = "zhisuan_data_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }  # bundled = 静态链接 sqlite,不依赖系统
calamine = "0.26"
notify = "6"
notify-debouncer-full = "0.3"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[features]
# 默认特性,Tauri 必需
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
